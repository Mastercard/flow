<mat-toolbar>
    <app-menu current="index"></app-menu>
    <span id="model_title">{{index.meta.modelTitle}}</span>
    <span>&nbsp;|&nbsp;</span>
    <span id="test_title">{{index.meta.testTitle}}</span>
    <span id="timestamp">{{timestamp}}</span>
</mat-toolbar>

<app-flow-filter [tags]="tags">
</app-flow-filter>

<app-tag-summary [entries]="filteredFlows"></app-tag-summary>

<app-system-diagram></app-system-diagram>

<ng-container *ngIf="!error">
    <app-flow-nav-list [entries]="pagedFlows" [draggable]="false">
    </app-flow-nav-list>
    <p id="no_flows" *ngIf="filteredFlows.length === 0">No flows match the current filters.</p>
    <div class="pagination" *ngIf="filteredFlows.length > pageSizeOptions[0]">
        <mat-paginator [length]="filteredFlows.length" [pageIndex]="pageIndex" [pageSize]="pageSize"
            [pageSizeOptions]="pageSizeOptions" [showFirstLastButtons]="true" aria-label="Flow pages"
            (page)="onPage($event)">
        </mat-paginator>
    </div>
</ng-container>


<pre *ngIf="error">
    There has been a problem!
    {{error}}
    {{error_data | json}}
  </pre>
