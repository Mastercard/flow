name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example, v1.1.8)
        required: true
        type: string
      publish:
        description: Publish to Maven Central (leave disabled to validate signing only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: maven-central-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.tag }}
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
      with:
        java-version: '17'
        distribution: temurin
        cache: maven
        server-id: central
        server-username: MAVEN_CENTRAL_USERNAME
        server-password: MAVEN_CENTRAL_TOKEN
        gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
        gpg-passphrase: GPG_PASSPHRASE

    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '14.15.1'
        cache: npm
        cache-dependency-path: report/report-ng/package-lock.json

    - name: Verify release tag
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        if [[ "${RELEASE_TAG}" != v* ]]; then
          echo "Release tag must start with 'v': ${RELEASE_TAG}" >&2
          exit 1
        fi
        if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" ]]; then
          echo "Checked-out commit does not match tag ${RELEASE_TAG}" >&2
          exit 1
        fi
        VERSION="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout | tail -n 1)"
        if [[ "${VERSION}" == *-SNAPSHOT ]]; then
          echo "Refusing to publish snapshot version ${VERSION}" >&2
          exit 1
        fi
        if [[ "v${VERSION}" != "${RELEASE_TAG}" ]]; then
          echo "Project version ${VERSION} does not match tag ${RELEASE_TAG}" >&2
          exit 1
        fi

    - name: Build and test
      run: mvn -B clean -Dnode=system -Dbrowser.skip=true -P '!node-system-test' package

    - name: Validate artifact signing
      if: ${{ !inputs.publish }}
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: mvn -B -Dnode=system -Prelease -DskipTests verify

    - name: Save signatures
      if: ${{ !inputs.publish }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: maven-central-signatures-${{ inputs.tag }}
        path: '**/target/**/*.asc'
        if-no-files-found: error

    - name: Publish to Maven Central
      if: ${{ inputs.publish }}
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
      run: mvn -B -Dnode=system -Prelease -DskipTests deploy
